<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Puzzle">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Puzzle</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f4ed;
      --ink: #23211d;
      --line: #d9d2c4;
      --tile: #fffdf8;
      --active: #2f6f73;
      --active-soft: #dcebea;
      --good: #2f7d50;
      --good-soft: #dbeadc;
      --bad: #b84a3a;
      --bad-soft: #f0d8d3;
      --warn: #9a6a18;
      --warn-soft: #f4e6c6;
      --info: #2f6877;
      --info-soft: #d9eaed;
      --box: clamp(46px, 13.6vw, 78px);
      --op-box: clamp(18px, 5vw, 36px);
      --gap: clamp(5px, 1.8vw, 7px);
      --shadow: 0 12px 34px rgba(42, 35, 24, .11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body:not(.solved).mistake {
      animation: mistake-background .42s ease both;
    }

    body.solved {
      background: #edf7ef;
    }

    main {
      width: min(100%, 520px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 18px;
    }

    button {
      border: 0;
      border-radius: 8px;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .num:active,
    .action:active {
      transform: translateY(1px);
    }

    .stage {
      align-self: center;
      display: grid;
      gap: 18px;
    }

    .board-wrap {
      display: grid;
      place-items: center;
      padding: 10px 0;
    }

    .board {
      width: calc((var(--box) * 5) + (var(--op-box) * 2) + (var(--gap) * 6));
      max-width: 100%;
      display: grid;
      grid-template-columns: var(--box) var(--box) var(--op-box) var(--box) var(--op-box) var(--box) var(--box);
      grid-template-rows: var(--box) var(--box) var(--op-box) var(--box) var(--op-box) var(--box) var(--box);
      gap: var(--gap);
      align-items: center;
      justify-items: center;
      transition: transform .25s ease;
    }

    .board.solved {
      animation: solved-board .7s cubic-bezier(.2, 1.35, .35, 1) both;
    }

    .board.mistake {
      animation: mistake-shake .42s ease both;
    }

    .cell,
    .target {
      width: 100%;
      height: 100%;
      min-width: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .cell {
      background: var(--tile);
      border: 2px solid var(--line);
      box-shadow: var(--shadow);
      font-size: clamp(1.35rem, 9vw, 2.45rem);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .cell.active {
      border-color: var(--active);
      background: var(--active-soft);
      transform: scale(1.025);
    }

    .cell.locked {
      color: #1f6842;
      background: #edf7ef;
      border-color: #8ec59c;
      box-shadow: 0 10px 24px rgba(47, 125, 80, .12);
      cursor: default;
    }

    .cell.hint {
      animation: hint-cell .85s cubic-bezier(.2, 1.25, .35, 1) both;
    }

    .target {
      background: #e7dfd0;
      border: 1px solid #d0c5b2;
      width: var(--box);
      height: var(--box);
      min-width: var(--box);
      padding: 0 8px;
      font-size: clamp(.94rem, 4.8vw, 1.42rem);
      gap: 4px;
      grid-auto-flow: column;
      white-space: nowrap;
    }

    .target::before {
      content: "=";
      color: currentColor;
      font-weight: 800;
      opacity: .72;
    }

    .op {
      color: #5f5a51;
      font-size: clamp(1rem, 6vw, 1.45rem);
      font-weight: 800;
      line-height: 1;
    }

    .top-target { grid-column: 7; grid-row: 2; justify-self: start; }
    .right-target { grid-column: 6; grid-row: 7; align-self: start; }
    .bottom-target { grid-column: 1; grid-row: 6; justify-self: end; }
    .left-target { grid-column: 2; grid-row: 1; align-self: end; }

    [data-cell="tl"] { grid-column: 2; grid-row: 2; }
    [data-cell="t"] { grid-column: 4; grid-row: 2; }
    [data-cell="tr"] { grid-column: 6; grid-row: 2; }
    [data-cell="r"] { grid-column: 6; grid-row: 4; }
    [data-cell="br"] { grid-column: 6; grid-row: 6; }
    [data-cell="b"] { grid-column: 4; grid-row: 6; }
    [data-cell="bl"] { grid-column: 2; grid-row: 6; }
    [data-cell="l"] { grid-column: 2; grid-row: 4; }

    .op-top-1 { grid-column: 3; grid-row: 2; }
    .op-top-2 { grid-column: 5; grid-row: 2; }
    .op-right-1 { grid-column: 6; grid-row: 3; }
    .op-right-2 { grid-column: 6; grid-row: 5; }
    .op-bottom-1 { grid-column: 5; grid-row: 6; }
    .op-bottom-2 { grid-column: 3; grid-row: 6; }
    .op-left-1 { grid-column: 2; grid-row: 5; }
    .op-left-2 { grid-column: 2; grid-row: 3; }

    .target.ok {
      background: var(--good-soft);
      color: var(--good);
      border-color: #a9cdb0;
    }

    .target.fail {
      background: var(--bad-soft);
      color: var(--bad);
      border-color: #d6aca4;
    }

    .result {
      grid-column: 3 / 6;
      grid-row: 4;
      z-index: 2;
      position: relative;
      align-self: center;
      justify-self: center;
      min-width: min(128px, 36vw);
      min-height: 88px;
      padding: 18px 10px 10px;
      display: none;
      text-align: center;
      color: #1f6842;
      background: transparent;
      border: 0;
      pointer-events: none;
      animation: result-pop .38s cubic-bezier(.2, 1.25, .35, 1) both;
    }

    .board.solved .result {
      display: block;
    }

    .result-check {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 118px;
      height: 118px;
      z-index: 0;
      overflow: hidden;
      stroke: rgba(47, 125, 80, .24);
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      clip-path: inset(0 100% 0 0);
    }

    .result-check path {
      vector-effect: non-scaling-stroke;
    }

    .board.solved .result-check {
      animation: draw-check .72s .12s cubic-bezier(.25, .9, .25, 1) both;
    }

    .result-meta {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 4px;
      color: #245f42;
      font-size: .86rem;
      font-weight: 780;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .7);
    }

    .result-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .result-line svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      stroke: currentColor;
    }

    @keyframes solved-board {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.035);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes mistake-shake {
      0% {
        transform: translateX(0);
      }
      20% {
        transform: translateX(-4px);
      }
      45% {
        transform: translateX(4px);
      }
      70% {
        transform: translateX(-2px);
      }
      100% {
        transform: translateX(0);
      }
    }

    @keyframes mistake-background {
      0%, 100% {
        background: var(--paper);
      }
      35% {
        background: #f8e8e4;
      }
    }

    @keyframes draw-check {
      0% {
        opacity: 0;
        visibility: hidden;
        clip-path: inset(0 100% 0 0);
      }
      to {
        opacity: 1;
        visibility: visible;
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes hint-cell {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes result-pop {
      0% {
        opacity: 0;
        transform: scale(.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 7px;
    }

    .num {
      height: 48px;
      background: #fffdf8;
      border: 1px solid var(--line);
      box-shadow: 0 6px 14px rgba(42, 35, 24, .08);
      font-weight: 760;
      font-size: 1.1rem;
    }

    .num.used {
      color: #aaa195;
      background: #e9e2d6;
      box-shadow: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 10px;
    }

    .action {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #302d28;
      color: #fffaf0;
      font-weight: 720;
    }

    .action:disabled,
    .num:disabled {
      cursor: default;
      opacity: .46;
      transform: none;
      box-shadow: none;
    }

    .action .icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      flex: 0 0 18px;
      place-items: center;
      line-height: 1;
    }

    .action svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
    }

    .action.clear {
      color: #6f372f;
      background: #f0ded9;
      border: 1px solid #d6b3aa;
    }

    .action.hint {
      color: var(--warn);
      background: var(--warn-soft);
      border: 1px solid #dec58f;
    }

    .action.new {
      color: var(--info);
      background: var(--info-soft);
      border: 1px solid #b3d0d7;
    }

    .action.check {
      color: #fffaf0;
      background: var(--good);
      border: 1px solid #266942;
    }

    @media (max-width: 380px) {
      :root {
        --box: clamp(42px, 13.2vw, 52px);
        --op-box: clamp(16px, 4.8vw, 18px);
        --gap: 5px;
      }

      main {
        padding-left: 12px;
        padding-right: 12px;
      }

      .board {
        gap: 5px;
      }

      .target {
        padding: 0 6px;
      }

      .keypad {
        gap: 5px;
      }

      .num {
        height: 43px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="Puzzle">
      <div class="board-wrap">
        <div class="board" id="board">
          <div class="target left-target" data-target="left"></div>
          <button class="cell" data-cell="tl" type="button" aria-label="Top left cell"></button>
          <span class="op op-top-1" data-op="top-0"></span>
          <button class="cell" data-cell="t" type="button" aria-label="Top middle cell"></button>
          <span class="op op-top-2" data-op="top-1"></span>
          <button class="cell" data-cell="tr" type="button" aria-label="Top right cell"></button>
          <div class="target top-target" data-target="top"></div>
          <span class="op op-left-2" data-op="left-1"></span>
          <span class="op op-right-1" data-op="right-0"></span>
          <button class="cell" data-cell="l" type="button" aria-label="Middle left cell"></button>
          <div class="result" id="result" aria-live="polite">
            <svg class="result-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12 9 17 20 6" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <div class="result-meta">
              <div class="result-line">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 7v5l3 2"></path>
                </svg>
                <span id="resultTime"></span>
              </div>
              <div class="result-line">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3v3"></path>
                  <path d="M12 18v3"></path>
                  <path d="M3 12h3"></path>
                  <path d="M18 12h3"></path>
                  <path d="m5.6 5.6 2.1 2.1"></path>
                  <path d="m16.3 16.3 2.1 2.1"></path>
                  <path d="m18.4 5.6-2.1 2.1"></path>
                  <path d="m7.7 16.3-2.1 2.1"></path>
                </svg>
                <span id="resultHints"></span>
              </div>
            </div>
          </div>
          <button class="cell" data-cell="r" type="button" aria-label="Middle right cell"></button>
          <span class="op op-left-1" data-op="left-0"></span>
          <span class="op op-right-2" data-op="right-1"></span>
          <button class="cell" data-cell="bl" type="button" aria-label="Bottom left cell"></button>
          <span class="op op-bottom-2" data-op="bottom-1"></span>
          <button class="cell" data-cell="b" type="button" aria-label="Bottom middle cell"></button>
          <span class="op op-bottom-1" data-op="bottom-0"></span>
          <button class="cell" data-cell="br" type="button" aria-label="Bottom right cell"></button>
          <div class="target bottom-target" data-target="bottom"></div>
          <div class="target right-target" data-target="right"></div>
        </div>
      </div>
    </section>

    <footer>
      <div class="keypad" id="keypad" aria-label="Digits"></div>
      <div class="actions">
        <button class="action clear" id="clear" type="button">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 21 10.5-10.5a3 3 0 0 0 0-4.2L15.7 4.5a3 3 0 0 0-4.2 0L3 13l8 8Z"></path>
              <path d="M14 7 6 15"></path>
              <path d="M11 21h9"></path>
            </svg>
          </span>
          <span>Clear</span>
        </button>
        <button class="action hint" id="hint" type="button">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v3"></path>
              <path d="M12 18v3"></path>
              <path d="M3 12h3"></path>
              <path d="M18 12h3"></path>
              <path d="m5.6 5.6 2.1 2.1"></path>
              <path d="m16.3 16.3 2.1 2.1"></path>
              <path d="m18.4 5.6-2.1 2.1"></path>
              <path d="m7.7 16.3-2.1 2.1"></path>
            </svg>
          </span>
          <span>Hint</span>
        </button>
        <button class="action new" id="newGame" type="button">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2"></path>
              <path d="M4 5v4h4"></path>
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2"></path>
              <path d="M20 19v-4h-4"></path>
            </svg>
          </span>
          <span>New</span>
        </button>
        <button class="action check" id="check" type="button">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </span>
          <span>Check</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    const cellOrder = ["tl", "t", "tr", "r", "br", "b", "bl", "l"];
    const lines = {
      top: ["tl", "t", "tr"],
      right: ["tr", "r", "br"],
      bottom: ["br", "b", "bl"],
      left: ["bl", "l", "tl"]
    };
    const opSymbols = ["+", "-", "*"];
    const maxTarget = 45;
    const generationAttempts = 600;
    const state = {
      puzzle: null,
      entries: Object.fromEntries(cellOrder.map((cell) => [cell, ""])),
      activeCell: "tl",
      solved: false,
      lockedCells: new Set(),
      hintedCell: "",
      hintsUsed: 0,
      startedAt: 0,
      solvedAt: 0,
      targetStates: {}
    };

    const board = document.getElementById("board");
    const keypad = document.getElementById("keypad");
    const clearButton = document.getElementById("clear");
    const hintButton = document.getElementById("hint");
    const newGameButton = document.getElementById("newGame");
    const checkButton = document.getElementById("check");
    const resultTime = document.getElementById("resultTime");
    const resultHints = document.getElementById("resultHints");
    const cellButtons = Object.fromEntries([...document.querySelectorAll(".cell")].map((button) => [button.dataset.cell, button]));
    const targetEls = Object.fromEntries([...document.querySelectorAll(".target")].map((target) => [target.dataset.target, target]));
    const opEls = Object.fromEntries([...document.querySelectorAll(".op")].map((op) => [op.dataset.op, op]));
    const digitButtons = [];

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function calculate(values, ops) {
      const nums = [...values];
      const signs = [...ops];
      for (let i = 0; i < signs.length; i++) {
        if (signs[i] === "*") {
          nums.splice(i, 2, nums[i] * nums[i + 1]);
          signs.splice(i, 1);
          i--;
        }
      }
      return signs.reduce((total, op, index) => {
        return op === "+" ? total + nums[index + 1] : total - nums[index + 1];
      }, nums[0]);
    }

    function buildPuzzleFrom(solution) {
      const ops = {};
      const targets = {};
      for (const name of Object.keys(lines)) {
        ops[name] = [randomOp(), randomOp()];
        targets[name] = calculate(lines[name].map((cell) => solution[cell]), ops[name]);
      }
      return { solution, ops, targets };
    }

    function randomOp() {
      return opSymbols[Math.floor(Math.random() * opSymbols.length)];
    }

    function countSolutions(puzzle, stopAt = 2) {
      let count = 0;
      const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9];
      const assigned = {};
      const used = new Set();

      function lineReady(name) {
        return lines[name].every((cell) => assigned[cell] !== undefined);
      }

      function lineValid(name) {
        const values = lines[name].map((cell) => assigned[cell]);
        return calculate(values, puzzle.ops[name]) === puzzle.targets[name];
      }

      function impossibleAfter(cell) {
        if (cell === "tr" && lineReady("top") && !lineValid("top")) return true;
        if (cell === "br" && lineReady("right") && !lineValid("right")) return true;
        if (cell === "bl" && lineReady("bottom") && !lineValid("bottom")) return true;
        if (cell === "l" && lineReady("left") && !lineValid("left")) return true;
        return false;
      }

      function search(index) {
        if (count >= stopAt) return;
        if (index === cellOrder.length) {
          count++;
          return;
        }

        const cell = cellOrder[index];
        for (const digit of digits) {
          if (used.has(digit)) continue;
          assigned[cell] = digit;
          used.add(digit);
          if (!impossibleAfter(cell)) search(index + 1);
          used.delete(digit);
          delete assigned[cell];
        }
      }

      search(0);
      return count;
    }

    function generatePuzzle() {
      for (let attempt = 0; attempt < generationAttempts; attempt++) {
        const digits = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 8);
        const solution = Object.fromEntries(cellOrder.map((cell, index) => [cell, digits[index]]));
        const puzzle = buildPuzzleFrom(solution);
        if (Object.values(puzzle.targets).every((target) => target >= 0 && target <= maxTarget) && countSolutions(puzzle) === 1) {
          return puzzle;
        }
      }
      const fallback = {
        solution: { tl: 1, t: 2, tr: 3, r: 4, br: 5, b: 6, bl: 7, l: 8 },
        ops: {
          top: ["+", "+"],
          right: ["+", "-"],
          bottom: ["*", "+"],
          left: ["+", "*"]
        },
        targets: {}
      };
      for (const name of Object.keys(lines)) {
        fallback.targets[name] = calculate(lines[name].map((cell) => fallback.solution[cell]), fallback.ops[name]);
      }
      return fallback;
    }

    function startGame() {
      state.puzzle = generatePuzzle();
      state.entries = Object.fromEntries(cellOrder.map((cell) => [cell, ""]));
      state.activeCell = "tl";
      state.solved = false;
      state.lockedCells = new Set();
      state.hintedCell = "";
      state.hintsUsed = 0;
      state.solvedAt = 0;
      state.targetStates = {};
      state.startedAt = performance.now();
      document.body.classList.remove("solved", "mistake");
      render();
    }

    function render() {
      board.classList.toggle("solved", state.solved);
      document.body.classList.toggle("solved", state.solved);
      clearButton.disabled = state.solved;
      hintButton.disabled = state.solved || state.lockedCells.size === cellOrder.length;
      checkButton.disabled = state.solved;

      for (const id of cellOrder) {
        const cellButton = cellButtons[id];
        cellButton.textContent = state.entries[id];
        cellButton.classList.toggle("active", id === state.activeCell && !state.lockedCells.has(id));
        cellButton.classList.toggle("locked", state.lockedCells.has(id));
        cellButton.classList.toggle("hint", id === state.hintedCell);
        cellButton.disabled = state.solved || state.lockedCells.has(id);
      }

      for (const [name, target] of Object.entries(state.puzzle.targets)) {
        const targetEl = targetEls[name];
        targetEl.textContent = target;
        targetEl.classList.remove("ok", "fail");
        if (state.targetStates[name]) targetEl.classList.add(state.targetStates[name]);
      }

      resultTime.textContent = state.solved ? formatElapsed(state.solvedAt - state.startedAt) : "";
      resultHints.textContent = state.solved ? `${state.hintsUsed} ${state.hintsUsed === 1 ? "hint" : "hints"}` : "";

      for (const [line, ops] of Object.entries(state.puzzle.ops)) {
        ops.forEach((op, index) => {
          opEls[`${line}-${index}`].textContent = op;
        });
      }

      renderKeypad();
    }

    function buildKeypad() {
      keypad.innerHTML = "";
      for (let digit = 1; digit <= 9; digit++) {
        const button = document.createElement("button");
        button.className = "num";
        button.type = "button";
        button.textContent = digit;
        button.addEventListener("click", () => enterDigit(String(digit)));
        digitButtons.push(button);
        keypad.append(button);
      }
    }

    function renderKeypad() {
      const used = new Set(Object.values(state.entries).filter(Boolean));
      for (const button of digitButtons) {
        button.classList.toggle("used", used.has(button.textContent));
        button.disabled = state.solved;
      }
    }

    function enterDigit(digit) {
      if (state.solved || state.lockedCells.has(state.activeCell)) return;
      const currentValue = state.entries[state.activeCell];

      if (currentValue === digit) {
        state.entries[state.activeCell] = "";
      } else {
        const occupyingCell = cellOrder.find((cell) => !state.lockedCells.has(cell) && state.entries[cell] === digit);
        if (cellOrder.some((cell) => state.lockedCells.has(cell) && state.entries[cell] === digit)) return;
        if (occupyingCell) state.entries[occupyingCell] = "";
        state.entries[state.activeCell] = digit;
        moveToNextEmpty();
      }

      state.solved = false;
      state.targetStates = {};
      render();
      checkPuzzle({ flashOnWrong: true, keepWrongState: true });
    }

    function moveToNextEmpty() {
      const start = cellOrder.indexOf(state.activeCell);
      for (let offset = 1; offset <= cellOrder.length; offset++) {
        const next = cellOrder[(start + offset) % cellOrder.length];
        if (!state.entries[next] && !state.lockedCells.has(next)) {
          state.activeCell = next;
          return;
        }
      }
    }

    function getLineValue(name) {
      const values = lines[name].map((cell) => Number(state.entries[cell]));
      return calculate(values, state.puzzle.ops[name]);
    }

    function lineFilled(name) {
      return lines[name].every((cell) => state.entries[cell]);
    }

    function checkPuzzle({ flashOnWrong = true, keepWrongState = true } = {}) {
      let complete = true;
      let allCorrect = true;
      const targetStates = {};

      for (const name of Object.keys(lines)) {
        if (!lineFilled(name)) {
          complete = false;
          allCorrect = false;
          continue;
        }
        const correct = getLineValue(name) === state.puzzle.targets[name];
        targetStates[name] = correct ? "ok" : "fail";
        allCorrect = allCorrect && correct;
      }

      state.targetStates = keepWrongState || allCorrect ? targetStates : {};
      applyTargetStates(state.targetStates);

      if (allCorrect && complete) {
        state.solvedAt = performance.now();
        state.solved = true;
        render();
        return true;
      }

      if (complete && flashOnWrong) {
        flashMistake();
      }
      return false;
    }

    function flashMistake() {
      board.classList.remove("mistake");
      document.body.classList.remove("mistake");
      void board.offsetWidth;
      board.classList.add("mistake");
      document.body.classList.add("mistake");
      window.setTimeout(() => {
        board.classList.remove("mistake");
        document.body.classList.remove("mistake");
      }, 430);
    }

    function applyTargetStates(targetStates) {
      for (const targetEl of Object.values(targetEls)) {
        targetEl.classList.remove("ok", "fail");
      }
      for (const [name, status] of Object.entries(targetStates)) {
        targetEls[name].classList.add(status);
      }
    }

    function formatElapsed(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    board.addEventListener("click", (event) => {
      const cell = event.target.closest(".cell");
      if (!cell) return;
      if (state.lockedCells.has(cell.dataset.cell)) return;
      state.activeCell = cell.dataset.cell;
      render();
    });

    clearButton.addEventListener("click", () => {
      if (state.solved) return;
      const currentActiveCell = state.activeCell;
      state.entries = Object.fromEntries(cellOrder.map((cell) => [
        cell,
        state.lockedCells.has(cell) ? String(state.puzzle.solution[cell]) : ""
      ]));
      state.activeCell = state.lockedCells.has(currentActiveCell)
        ? cellOrder.find((cell) => !state.lockedCells.has(cell) && !state.entries[cell]) || "tl"
        : currentActiveCell;
      state.solved = false;
      state.targetStates = {};
      render();
    });

    hintButton.addEventListener("click", () => {
      if (state.solved) return;
      const candidates = cellOrder.filter((cell) => !state.lockedCells.has(cell));
      if (!candidates.length) return;

      const cell = candidates[Math.floor(Math.random() * candidates.length)];
      const digit = String(state.puzzle.solution[cell]);
      const occupyingCell = cellOrder.find((other) => other !== cell && !state.lockedCells.has(other) && state.entries[other] === digit);
      if (occupyingCell) state.entries[occupyingCell] = "";

      state.entries[cell] = digit;
      state.lockedCells.add(cell);
      state.hintedCell = cell;
      state.hintsUsed++;
      state.activeCell = cellOrder.find((other) => !state.lockedCells.has(other) && !state.entries[other]) || cell;
      state.solved = false;
      state.targetStates = {};
      render();
      checkPuzzle({ flashOnWrong: false, keepWrongState: false });
    });

    checkButton.addEventListener("click", () => {
      if (state.solved) return;
      checkPuzzle();
    });

    newGameButton.addEventListener("click", startGame);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }

    buildKeypad();
    startGame();
  </script>
</body>
</html>
